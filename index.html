<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>💰 Expense Tracker</h1>

    <button onclick="toggleDarkMode()" id="modeBtn">🌙 Dark Mode</button>
    <input type="text" id="search" placeholder="Search..." onkeyup="searchExpenses()">
    

    <input type="text" id="desc" placeholder="Enter description">

    <input type="number" id="amount" placeholder="Enter amount">

    <input type="date" id="date">

    <select id="category">
        <option value="">Select Category</option>
        <option value="Food">Food</option>
        <option value="Shopping">Shopping</option>
        <option value="Travel">Travel</option>
    </select>
 
    <button onclick="addExpense()">➕ Add Expense</button>

    <h2>Expenses</h2>
    <div id="expense-list"></div>

    <h3>Total: Rs <span id="total">0</span></h3>
    <h3 id="monthlySummary">Monthly Total: Rs 0</h3>
     <canvas id="myChart" width="300" height="300"></canvas>
     <div class="bottom-nav">
    <div><i class="fas fa-home"></i></div>
    <div><i class="fas fa-chart-pie"></i></div>
    <div><i class="fas fa-cog"></i></div>
</div>
<button onclick="clearAllExpenses()">🗑 Clear All</button>
    <button onclick="exportData()">📤 Export Data</button>
    <button onclick="logout()">🚪 Logout</button>
<button class="fab" onclick="addExpense()">➕</button>
</div>
<script>
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
</script>



<script src="script.js"></script>
</body>
</html>
